<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from "https://web.cs.manchester.ac.uk/three/three.js-master/build/three.module.js";

        let scene, camera, render;

        let sunGeometry, sunMaterial, sunMesh, earthGeometry, earthMaterial, earthMesh, moonGeometry, moonMaterial, moonMesh;

        const init = () => {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75,
                window.innerHeight / window.innerHeight, 0.1, 10000);
            camera.position.x = 0;
            camera.position.y = 30;
            camera.position.z = 500;
            render = new THREE.WebGLRender();
            render.setSize(window.innerHeight, window.innerHeight);
            document.body.appendChild(render.domElement);
        }

    </script>
</body>
</html>
