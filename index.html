<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from "https://web.cs.manchester.ac.uk/three/three.js-master/build/three.module.js";
        import { OrbitControls } from "https://web.cs.manchester.ac.uk/three/three.js-master/examples/jsm/controls/OrbitControls.js";

        let scene, camera, renderer;

        let sunGeometry, sunMaterial, sunMesh, earthGeometry, earthMaterial, earthMesh, moonGeometry, moonMaterial, moonMesh,
            cloudGeometry, cloudMaterial, cloudMesh, galaxyGeometry, galaxyMaterial, galaxyMesh;

        let earthSystem, orbitRadius = 40, curve;

        let controls;

        const init = () => {
            scene = new THREE.Scene();

            // last 2 arguments set the near and far plane
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.x = 0;
            camera.position.y = 30;
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // allows you to move viewpoint by clicking and dragging
            controls = new OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true;

            const loader = new THREE.TextureLoader();

            // geometry includes radius, number of horizontal segments and number of vertical segments
            const sunTexture = loader.load('./assets/sun.jpg');
            sunGeometry = new THREE.SphereGeometry(109, 400, 200);
            sunMaterial = new THREE.MeshStandardMaterial(
                {
                    emissive: 0xffd700,
                    emissiveMap: sunTexture,
                    emissiveIntensity: 1,
                    wireframe: false
                }
            );
            sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sunMesh);

            // sets colour, intensity and range of the light
            const light = new THREE.PointLight(0xffffff, 2, 2000);
            light.position.set(0, 0, 0); // centred at the sun
            scene.add(light);

            const ambientLight = new THREE.AmbientLight(0x404040); // soft white light
            scene.add(ambientLight);

            const earthTexture = loader.load('./assets/earth.jpg');
            earthGeometry = new THREE.SphereGeometry(25, 50, 50);
            earthMaterial = new THREE.MeshPhongMaterial(
                {
                    map: earthTexture
                }
            );
            earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
            scene.add(earthMesh);

            const cloudTexture = loader.load('./assets/cloud.jpg');
            cloudGeometry = new THREE.SphereGeometry(26, 50, 50);
            cloudMaterial = new THREE.MeshPhongMaterial(
                {
                    map: cloudTexture,
                    transparent: true,
                    opacity: 0.55
                }
            );
            cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial);
            scene.add(cloudMesh);

            const moonTexture = loader.load('./assets/moon.jpg')
            moonGeometry = new THREE.SphereGeometry(5, 40, 20);
            moonMaterial = new THREE.MeshPhongMaterial(
                {
                    map: moonTexture
                }
            );
            moonMesh = new THREE.Mesh(moonGeometry, moonMaterial);
            scene.add(moonMesh);

            // background
            const galaxyTexture = loader.load('./assets/milky_way.jpg');
            galaxyGeometry = new THREE.SphereGeometry(1000, 1000, 1000);
            galaxyMaterial = new THREE.MeshStandardMaterial(
                {
                    map: galaxyTexture,
                    side: THREE.DoubleSide
                }
            );
            galaxyMesh = new THREE.Mesh(galaxyGeometry, galaxyMaterial);
            scene.add(galaxyMesh);

            // group object that groups together the earth and the moon
            earthSystem = new THREE.Group();
            earthSystem.add(earthMesh);
            earthSystem.add(moonMesh);
            earthSystem.add(cloudMesh);
            moonMesh.position.set(orbitRadius, 0, 0); // sets position of the moon relative to this earth-moon system
            
            // Add Earth-Moon system to the scene
            scene.add(earthSystem);

            // constructor sets x,y coordinates of the centre, the radius in the x,y direction and
            // the start/end angles for drawing the ellipse
            curve = new THREE.EllipseCurve(0, 0, 200, 150, 0, 2 * Math.PI);
            const line = curve.getPoints(50); // generates 50 evenly spaced points along the curve
            const lineGeometry = new THREE.BufferGeometry().setFromPoints(line);

            const lineMaterial = new THREE.LineBasicMaterial(
                {
                    color: 0xff0000 
                } 
            );

            const ellipse = new THREE.Line(lineGeometry, lineMaterial);

            // rotate the orbit to lie in the XZ plane
            ellipse.rotation.x = Math.PI / 2; // rotate 90 degrees around the X-axis

            scene.add(ellipse);

            const earthOrbitRadius = 200;
            const w = 0.001;
            const t = performance.now() * 0.00001;

            earthSystem.position.x = earthOrbitRadius * Math.sin(2 * Math.PI * w * t);
            earthSystem.position.z = earthOrbitRadius * Math.cos(2 * Math.PI * w * t);

            animate();
        }

        const animate = () => {
            requestAnimationFrame(animate); // continuously calls itself for smooth animation

            let time = performance.now() * 0.0001;
            let t = time % 1;

            const point = curve.getPoint(t);

            earthSystem.position.x = point.x;
            earthSystem.position.z = point.y;

            let moonSpeed = 3;
            moonMesh.position.x = orbitRadius * Math.cos(time * moonSpeed);
            moonMesh.position.z = orbitRadius * Math.sin(time * moonSpeed);

            sunMesh.rotation.y += 0.002;
            cloudMesh.rotation.y += 0.015;
            earthMesh.rotation.y += 0.02;
            moonMesh.rotation.y += 0.05;

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
