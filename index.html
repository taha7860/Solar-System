<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <script type="module">
        import * as THREE from "https://web.cs.manchester.ac.uk/three/three.js-master/build/three.module.js";

        let scene, camera, renderer;

        let sunGeometry, sunMaterial, sunMesh, earthGeometry, earthMaterial, earthMesh, moonGeometry, moonMaterial, moonMesh;

        const init = () => {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.x = 0;
            camera.position.y = 30;
            camera.position.z = 500;

            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const light = new THREE.PointLight(0xff0000, 2, 1000);
            light.position.set(0, 0, 0);
            scene.add(light);

            sunGeometry = new THREE.SphereGeometry(109, 400, 200);
            sunMaterial = new THREE.MeshStandardMaterial(
                {
                    emissive: 0xffd700,
                    // emissiveMap: texture,
                    emissiveIntensity: 1,
                    wireframe: false
                }
            );
            sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
            scene.add(sunMesh);
        }

        init();
    </script>
</body>
</html>
